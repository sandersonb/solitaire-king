 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klondike Solitaire</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b3d20;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        position: relative;
        z-index: 1;
      }
      /* Loading spinner, shown during the wasm download/startup. It sits BEHIND
         the canvas; once the app paints its first opaque frame the canvas covers
         it, so no JS is needed to hide it. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b3d20;
        color: #f7f5e6;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      #loading .spinner {
        width: 48px;
        height: 48px;
        border: 5px solid rgba(247, 245, 230, 0.25);
        border-top-color: #f7f5e6;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading Klondike Solitaire…</div>
    </div>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- macroquad/miniquad JS glue, vendored for a fully self-contained deploy. -->
    <script src="mq_js_bundle.js"></script>
    <script>
      load("klondike-gui.wasm");
    </script>
  </body>
</html>
